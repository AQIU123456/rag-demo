server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_API_HOME_URL}
      model-name: deepseek-v4-flash
      temperature: 0.7
    
    # 阶段 2: 添加嵌入模型配置（用于向量化）
    embedding-model:
      api-key: ${OPENAI_API_KEY_ST}
      base-url: ${OPENAI_API_HOME_URL_ST}
      model-name: qwen3.7-text-embedding-flash

# 重排（Rerank）功能配置：向量粗排召回 -> 交叉编码器精排
rerank:
  # 总开关：false 时检索行为与纯向量排序完全一致
  enabled: true
  # OpenAI / vLLM / HuggingFace TEI 兼容的 /v1/rerank 接口地址
  # 留空时使用内置的本地轻量重排兜底（关键词重合度 + 向量分数融合）
  api-url: ${RERANK_API_URL:}
  # API 密钥（本地部署无鉴权时可为空）
  api-key: ${RERANK_API_KEY:}
  # 重排模型名称
  model-name: ${RERANK_MODEL_NAME:BAAI/bge-reranker-v2-m3}
  # 粗排召回数量倍数：实际召回 maxResults * candidate-multiplier 条候选再精排出前 maxResults 条
  candidate-multiplier: 3
  # 远程重排调用超时时间（毫秒），超时自动降级为本地/向量排序
  timeout-ms: 5000

# 图 RAG（GraphRAG）功能配置：LLM 抽取实体关系构建知识图谱 + 一跳扩展增强问答
graphrag:
  # 总开关：false 时 /api/graph/chat 行为退化为纯向量 RAG（不查询图谱）
  enabled: true
  # 图中邻居扩展跳数（当前实现支持 1 跳）
  max-hops: 1
  # 每个问题最多参与图检索的种子实体数量
  max-seed-entities: 5
  # 最终注入提示词的关系三元组最大条数
  max-triples-in-context: 20
  # 实体抽取与问题实体识别使用的 LLM 温度
  extraction-temperature: 0.0

# 企业级分块流水线配置（S1 链路收敛 / S2 结构增强 / S3 混合召回）
# A/B 对照组：把 structure-aware / context-prefix / bm25-enabled 全置 false 即为基线
chunk:
  max-tokens: 300
  overlap-tokens: 40
  parent-max-tokens: 900
  hard-max-chars: 4000
  # S2 能力：结构感知 + 上下文前缀（关闭即为 S1 基线，便于 RAGAS A/B）
  structure-aware: true
  context-prefix: true
  # 父子索引：全局默认关，前端选 PARENT_CHILD 策略时按次开启
  parent-child: false
  neighbor-window: 0
  max-per-document: 3
  active-version: v1
  recall-multiplier: 6
  min-score: 0.0
  # S3 能力：BM25 关键词通道 + RRF 融合
  bm25-enabled: true
  rrf-k: 60
  keyword-candidates: 30
  # 接入真实鉴权后再打开，否则会误伤无租户标记的存量数据
  tenant-filter-enabled: false
  current-tenant: default
  current-acl-tag: public
  observability: true

# 预留：Milvus 向量数据库配置（S3 物理删除切换时使用）
# milvus:
#   host: localhost
#   port: 19530
#   collection-name: knowledge_base

logging:
  level:
    com.example.aichat: DEBUG
    dev.langchain4j: DEBUG
