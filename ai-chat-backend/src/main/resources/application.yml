server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_API_HOME_URL}
      model-name: deepseek-v4-flash
      temperature: 0.7
    
    # 阶段 2: 添加嵌入模型配置（用于向量化）
    embedding-model:
      api-key: ${OPENAI_API_KEY_ST}
      base-url: ${OPENAI_API_HOME_URL_ST}
      model-name: Qwen/Qwen3-VL-Embedding-8B

# 预留：Milvus 向量数据库配置（后续切换时使用）
# milvus:
#   host: localhost
#   port: 19530
#   collection-name: knowledge_base

logging:
  level:
    com.example.aichat: DEBUG
    dev.langchain4j: DEBUG
